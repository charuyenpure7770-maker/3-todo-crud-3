<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css">
    <title>Todo CRUD</title>
    <link rel="stylesheet" href="./assets/css/style.css">
</head>
<body>
    <div class="container">
        <div class="row mt-5">
            <div class="col-md-6 mx-auto">
                <form id="form">
                    <div class="card shadow todo-card">
                        <div class="card-header header text-center">
                            <h3><i class="fa-solid fa-list-check mr-2"></i>Todo List</h3>
                            <p class="mb-0">Organize your day, one task at a time</p>
                        </div>
                        <div class="card-body">
                            <label for="todo">Add New Todo</label>
                            <input type="text" class="form-control" id="todo" placeholder="Enter your todo " required>
                        </div>
                        <div class="card-footer d-flex justify-content-between">
                            <button type="submit" class="btn btn-add btn-sm" id="submitBtn">
                                <i class="fa-solid fa-plus mr-1"></i> Add Todo
                            </button>
                            <button type="button" class="btn btn-update btn-sm d-none" id="updateBtn">
                                <i class="fa-solid fa-rotate mr-1"></i> Update Todo
                            </button>
                        </div>
                    </div>
                </form>
            </div>
        </div>

        <div class="row mt-4" id="todoContainer">
           <div class="col-md-4 mb-3">
                <!-- <ul class="list-group">
                    <li class="list-group-item d-flex justify-content-between align-items-center">
                        <strong>${ele.todo}</strong>
                        <div>
                            <i onclick="onEdit(this)" class="fa-solid fa-pen-to-square fa-lg text-primary mr-3"></i>
                            <i onclick="onRemove(this)" class="fa-solid fa-trash fa-lg text-danger"></i>
                        </div>
                    </li>
                </ul> -->
            </div>
        </div>

        <div class="spinner d-none" id="spinner">
            <div class="spinner-border" role="status">
                <span class="sr-only">Loading...</span>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="./assets/js/app.js"></script>
</body>
</html>
